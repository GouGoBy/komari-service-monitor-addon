# Inside the existing server { } block. Root: /www/wwwroot/komari/frontend.
# Replace the previous /api/, /ping and / locations; do not add duplicates.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:25774;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 100m;
}
location = /ping { proxy_pass http://127.0.0.1:25774; }

# The same entry selects the complete Komari console or Lumina homepage.
# Keep /control/ for compatibility with the previous package.
location ^~ /control/ { try_files $uri =404; }
location = /admin { return 302 /admin/dashboard; }
location ^~ /admin/ { try_files $uri /index.html; }
location = /terminal { try_files /index.html =404; }
location ^~ /terminal/ { try_files $uri /index.html; }
location = /install { try_files /index.html =404; }
location = /database-recovery { try_files /index.html =404; }

# Lumina homepage, instance details and service monitoring views.
location / { try_files $uri $uri/ /index.html; }
